name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viral-futbol-render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and verify Viral Futbol
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://viralfutbol.onrender.com/health"
          response="$(curl             --fail             --silent             --show-error             --location             --retry 3             --retry-delay 8             --retry-all-errors             --connect-timeout 15             --max-time 90             "$endpoint")"
          echo "$response" | grep -q '"status": "ok"'
          echo "Viral Futbol is awake and healthy."
