[project]
name = "viral-futbol"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "requests-oauthlib>=2.0,<3",
  "Pillow>=10,<13",
  "google-api-python-client>=2.149,<3",
  "google-auth>=2.35,<3",
  "google-auth-httplib2>=0.2,<1",
  "edge-tts>=7,<8",
]

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["viral_futbol*", "bamloop*", "production*", "scripts*"]

[tool.setuptools.package-data]
bamloop = ["meme_clips.json"]
