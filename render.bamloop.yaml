services:
  - type: web
    name: bamloop
    runtime: docker
    dockerfilePath: ./Dockerfile.bamloop
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: REMOTION_ENABLED
        value: "false"
      - key: REMOTION_SMOKE_ON_START
        value: "false"
      - key: REMOTION_TIMEOUT_SECONDS
        value: "360"
      - key: MEME_OUTPUT_DIR
        value: storage/bamloop
      - key: PUBLISH_DIRECT_ENABLED
        value: "true"
      - key: PUBLISH_LEDGER_REQUIRED
        value: "true"
      - key: GITHUB_LEDGER_TOKEN
        sync: false
      - key: MEME_INTERVAL_SECONDS
        value: "14400"
      - key: MEME_STARTUP_DELAY_SECONDS
        value: "20"
      - key: MEME_DB_PATH
        value: storage/bamloop/bamloop.sqlite3
      - key: MAX_SHORTS_PER_DAY
        value: "5"
      - key: MIN_HOURS_BETWEEN_SHORTS
        value: "3"
      - key: CHANNEL_TIMEZONE
        value: Europe/Istanbul
      - key: MAX_VIDEOS_PER_DAY
        value: "1"
      - key: MIN_HOURS_BETWEEN_VIDEOS
        value: "12"
      - key: BAMLOOP_LONGFORM_ENABLED
        value: "true"
      - key: BAMLOOP_LONGFORM_INTERVAL_HOURS
        value: "24"
      - key: BAMLOOP_LONGFORM_OUTPUT_DIR
        value: storage/bamloop/longform
      - key: LONGFORM_MIN_EVIDENCE
        value: "10"
      - key: LONGFORM_MIN_REAL_MEDIA
        value: "8"
      - key: LONGFORM_MEDIA_TARGET
        value: "12"
      - key: LONGFORM_VISUAL_BEAT_SECONDS
        value: "5.0"
      - key: LONGFORM_MUSIC_ENABLED
        value: "true"
      - key: LONGFORM_RENDER_ONLY_WHEN_SLOT_READY
        value: "true"
      - key: PUBLISH_SLOT_GRACE_MINUTES
        value: "30"
      - key: LONGFORM_TTS_RATE
        value: "+5%"
      - key: REMOTION_LONGFORM_TIMEOUT_SECONDS
        value: "900"
      - key: LONGFORM_LLM_BASE_URL
        sync: false
      - key: LONGFORM_LLM_MODEL
        sync: false
      - key: LONGFORM_LLM_API_KEY
        sync: false
      - key: PUBLISH_QUEUE_ENABLED
        value: "true"
      - key: SMART_PUBLISH_SCHEDULING
        value: "true"
      - key: BAMLOOP_DAILY_AI_BUDGET_USD
        value: "0"
      - key: MEME_YOUTUBE_ENABLED
        value: "false"
      - key: MEME_YOUTUBE_PRIVACY_STATUS
        value: private
      - key: PEXELS_API_KEY
        sync: false
      - key: MEME_YOUTUBE_CLIENT_ID
        sync: false
      - key: MEME_YOUTUBE_CLIENT_SECRET
        sync: false
      - key: MEME_YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: MEME_YOUTUBE_EXPECTED_CHANNEL_ID
        sync: false
