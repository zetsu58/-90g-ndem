services:
  - type: web
    name: bamloop
    runtime: docker
    dockerfilePath: ./Dockerfile.bamloop
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: REMOTION_ENABLED
        value: "false"
      - key: REMOTION_SMOKE_ON_START
        value: "false"
      - key: REMOTION_TIMEOUT_SECONDS
        value: "360"
      - key: MEME_OUTPUT_DIR
        value: storage/bamloop
      - key: PUBLISH_DIRECT_ENABLED
        value: "true"
      - key: PUBLISH_LEDGER_REQUIRED
        value: "true"
      - key: GITHUB_LEDGER_TOKEN
        sync: false
      - key: MEME_INTERVAL_SECONDS
        value: "14400"
      - key: MEME_STARTUP_DELAY_SECONDS
        value: "20"
      - key: MEME_DB_PATH
        value: storage/bamloop/bamloop.sqlite3
      - key: MAX_SHORTS_PER_DAY
        value: "5"
      - key: MIN_HOURS_BETWEEN_SHORTS
        value: "3"
      - key: CHANNEL_TIMEZONE
        value: Europe/Istanbul
      - key: PUBLISH_QUEUE_ENABLED
        value: "true"
      - key: SMART_PUBLISH_SCHEDULING
        value: "true"
      - key: BAMLOOP_DAILY_AI_BUDGET_USD
        value: "0"
      - key: MEME_YOUTUBE_ENABLED
        value: "false"
      - key: MEME_YOUTUBE_PRIVACY_STATUS
        value: private
      - key: PEXELS_API_KEY
        sync: false
      - key: MEME_YOUTUBE_CLIENT_ID
        sync: false
      - key: MEME_YOUTUBE_CLIENT_SECRET
        sync: false
      - key: MEME_YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: MEME_YOUTUBE_EXPECTED_CHANNEL_ID
        sync: false
