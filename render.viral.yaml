services:
  - type: web
    name: viral-futbol
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BAMLOOP_CONTENT_MODE
        value: reaction_meme
      - key: UNIFIED_YOUTUBE_CHANNEL
        value: "true"
      - key: SHORTS_ONLY_MODE
        value: "true"
      - key: PUBLISH_LIMITS_PER_SOURCE
        value: "true"
      - key: MEME_INTERVAL_SECONDS
        value: "10800"
      - key: REMOTION_ENABLED
        value: "false"
      - key: REMOTION_TIMEOUT_SECONDS
        value: "360"
      - key: REMOTION_SMOKE_ON_START
        value: "false"
      - key: NEWS_DB_PATH
        value: storage/viral_futbol.sqlite3
      - key: LITE_VIDEO_DIR
        value: storage/videos
      - key: PUBLISH_DIRECT_ENABLED
        value: "true"
      - key: PUBLISH_LEDGER_REQUIRED
        value: "true"
      - key: GITHUB_LEDGER_TOKEN
        sync: false
      - key: VIDEO_ENGINE
        value: lite
      - key: SHORTS_MIN_WIDTH
        value: "720"
      - key: SHORTS_MIN_HEIGHT
        value: "1280"
      - key: NEWS_AUTOSTART_WORKER
        value: "true"
      - key: NEWS_WORKER_INTERVAL_SECONDS
        value: "120"
      - key: NEWS_DRY_RUN
        value: "false"
      - key: NEWS_MAX_AGE_MINUTES
        value: "180"
      - key: SHORTS_MAX_AGE_MINUTES
        value: "180"
      - key: VIRAL_TREND_MIN_SCORE
        value: "25"
      - key: MAX_SHORTS_PER_DAY
        value: "5"
      - key: MIN_HOURS_BETWEEN_SHORTS
        value: "3"
      - key: CHANNEL_TIMEZONE
        value: Europe/Istanbul
      - key: MAX_VIDEOS_PER_DAY
        value: "0"
      - key: MIN_HOURS_BETWEEN_VIDEOS
        value: "12"
      - key: VIRAL_LONGFORM_ENABLED
        value: "false"
      - key: BAMLOOP_LONGFORM_ENABLED
        value: "false"
      - key: LONGFORM_ENABLED
        value: "false"
      - key: VIRAL_LONGFORM_INTERVAL_HOURS
        value: "24"
      - key: VIRAL_LONGFORM_OUTPUT_DIR
        value: storage/viral_longform
      - key: LONGFORM_MIN_EVIDENCE
        value: "10"
      - key: LONGFORM_MIN_REAL_MEDIA
        value: "8"
      - key: LONGFORM_MIN_VIDEO_BROLL
        value: "0"
      - key: LONGFORM_FAST_FFMPEG
        value: "true"
      - key: LONGFORM_MEDIA_TARGET
        value: "12"
      - key: LONGFORM_VISUAL_BEAT_SECONDS
        value: "5.0"
      - key: LONGFORM_TARGET_LUFS
        value: "-16"
      - key: LONGFORM_TRUE_PEAK_DBTP
        value: "-1.5"
      - key: LONGFORM_TARGET_LRA
        value: "9"
      - key: LONGFORM_QC_MIN_CHANGE_RATIO
        value: "0.32"
      - key: LONGFORM_QC_MAX_DARK_RATIO
        value: "0.08"
      - key: LONGFORM_MUSIC_ENABLED
        value: "true"
      - key: LONGFORM_RENDER_ONLY_WHEN_SLOT_READY
        value: "true"
      - key: PUBLISH_SLOT_GRACE_MINUTES
        value: "30"
      - key: LONGFORM_TTS_RATE
        value: "+5%"
      - key: REMOTION_LONGFORM_TIMEOUT_SECONDS
        value: "900"
      - key: LONGFORM_LLM_BASE_URL
        sync: false
      - key: LONGFORM_LLM_MODEL
        sync: false
      - key: LONGFORM_LLM_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PUBLISH_QUEUE_ENABLED
        value: "true"
      - key: SMART_PUBLISH_SCHEDULING
        value: "true"
      - key: YOUTUBE_ENABLED
        value: "true"
      - key: YOUTUBE_PRIVACY_STATUS
        value: public
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_EXPECTED_CHANNEL_ID
        sync: false
