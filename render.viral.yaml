services:
  - type: web
    name: viral-futbol
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: REMOTION_ENABLED
        value: "false"
      - key: REMOTION_TIMEOUT_SECONDS
        value: "360"
      - key: REMOTION_SMOKE_ON_START
        value: "false"
      - key: NEWS_DB_PATH
        value: storage/viral_futbol.sqlite3
      - key: LITE_VIDEO_DIR
        value: storage/videos
      - key: PUBLISH_DIRECT_ENABLED
        value: "true"
      - key: PUBLISH_LEDGER_REQUIRED
        value: "true"
      - key: GITHUB_LEDGER_TOKEN
        sync: false
      - key: VIDEO_ENGINE
        value: lite
      - key: SHORTS_MIN_WIDTH
        value: "720"
      - key: SHORTS_MIN_HEIGHT
        value: "1280"
      - key: NEWS_AUTOSTART_WORKER
        value: "true"
      - key: NEWS_WORKER_INTERVAL_SECONDS
        value: "120"
      - key: NEWS_DRY_RUN
        value: "false"
      - key: NEWS_MAX_AGE_MINUTES
        value: "180"
      - key: SHORTS_MAX_AGE_MINUTES
        value: "180"
      - key: VIRAL_TREND_MIN_SCORE
        value: "25"
      - key: MAX_SHORTS_PER_DAY
        value: "5"
      - key: MIN_HOURS_BETWEEN_SHORTS
        value: "3"
      - key: CHANNEL_TIMEZONE
        value: Europe/Istanbul
      - key: PUBLISH_QUEUE_ENABLED
        value: "true"
      - key: SMART_PUBLISH_SCHEDULING
        value: "true"
      - key: YOUTUBE_ENABLED
        value: "false"
      - key: YOUTUBE_PRIVACY_STATUS
        value: private
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_EXPECTED_CHANNEL_ID
        sync: false
